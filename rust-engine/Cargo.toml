[package]
name = "accelerate-engine"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Independent immutable Augment Chess rules engine"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"

[[bin]]
name = "accelerate-engine-json"
path = "src/bin/engine-json.rs"
