[package]
name = "accelerate-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Validated ONNX CPU inference with explicit ort and tract backends"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
prost = "0.14"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
tract = { version = "=0.23.8", default-features = false, features = ["onnx"] }
