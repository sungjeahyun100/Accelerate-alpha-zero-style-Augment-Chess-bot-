[package]
name = "accelerate-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Thin owned PyO3 boundary for the independent rules engine"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
accelerate-engine = { path = "../../rust-engine" }
accelerate-runtime = { path = "../runtime" }
pyo3 = { version = "=0.29.2", features = ["abi3-py312"] }
numpy = "=0.29.0"
serde = "1"
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
