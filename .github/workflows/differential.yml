name: Historical JS fixture harness

# Checks historical engine-merged.js answer sheets with their original JS
# line-protocol server. This does not establish frozen-client/Rust parity.
# That independent gate must use engine-json's actual method protocol and
# lossless source payloads. It remains pending until the full source port can
# be compared, without substituting a fallback for Unsupported cases.
on:
  push:
    branches: [main, develop]
    paths:
      - "projects/augment-chess/reference/infra/tools/fixtures/**"
      - "projects/augment-chess/reference/infra/engine-merged.js"
      - "projects/augment-chess/tests/differential/**"
      - ".github/workflows/differential.yml"
  pull_request:
    paths:
      - "projects/augment-chess/reference/infra/tools/fixtures/**"
      - "projects/augment-chess/reference/infra/engine-merged.js"
      - "projects/augment-chess/tests/differential/**"
      - ".github/workflows/differential.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  historical-fixtures:
    name: Historical JS fixture and harness validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate historical fixtures with their original JS server
        env:
          CANDIDATE_CMD: node projects/augment-chess/reference/infra/tools/fixtures/generate-fixtures.js --serve
        run: |
          report_dir="$RUNNER_TEMP/Accelerate/reports/historical-fixtures/Linux"
          mkdir -p "$report_dir"
          node projects/augment-chess/reference/infra/tools/fixtures/run-differential.js \
            --fixtures=projects/augment-chess/tests/differential/fixtures/oracle-v1.jsonl.gz \
            --candidate="$CANDIDATE_CMD" \
            --limit=300 \
            --report="$report_dir/report.json"
          echo "Validated historical JS fixtures and their JS harness. Frozen-client/Rust source parity is a separate pending gate." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve historical harness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-js-fixture-report
          path: ${{ runner.temp }}/Accelerate/reports/historical-fixtures/Linux
          if-no-files-found: warn
          retention-days: 7
