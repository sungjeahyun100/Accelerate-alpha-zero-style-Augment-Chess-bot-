name: Native bot code validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash also gives Windows multi-command checks fail-on-error behavior.
defaults:
  run:
    shell: bash

concurrency:
  group: native-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-bot:
    name: Python 3.12 / Rust 1.96 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux wheel currently requires glibc 2.39 (manylinux_2_39).
          - os: ubuntu-24.04
            uv-checksum: 23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8
          - os: windows-2025
            uv-checksum: 6dbb02d79e419522f1c500f0adb1cddcff0cda7d59b0d66ea7f5e3b4a1b2f5f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
          download-from-astral-mirror: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-12
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - name: Configure external artifact slots
        run: python .github/scripts/native-bot-check.py configure
      - name: Repository policy
        run: |
          node --test .github/scripts/check-repository-policy.test.mjs
          node .github/scripts/check-repository-policy.mjs
          git diff --check
      - name: Rust workspace formatting and strict lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust workspace tests
        run: cargo test --workspace --locked
      - name: Locked dependencies and sdist to installed wheel
        run: python .github/scripts/native-bot-check.py build
      - name: Installed native, model, ort / tract, search and bounded CLI tests
        run: python .github/scripts/native-bot-check.py tests
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bot-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}
          if-no-files-found: warn
          retention-days: 7

  game-adapter:
    name: Frozen game adapter / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full v6/v7 parity runs on both OSes; synthetic card probes are split.
          - os: ubuntu-24.04
            audit_shards: '0 2 4 6'
          - os: windows-2025
            audit_shards: '1 3 5 7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify previous v6 frozen client and runtime contract
        run: python .github/scripts/native-bot-check.py frozen
      - name: Verify pinned current v7 client, metadata and three-mode parity
        id: current
        if: ${{ !cancelled() }}
        run: python .github/scripts/native-bot-check.py current-client
      - name: Audit bounded current card surface
        if: ${{ !cancelled() && steps.current.outcome == 'success' }}
        env:
          AUDIT_SHARDS: ${{ matrix.audit_shards }}
        run: |
          set -e
          for shard in $AUDIT_SHARDS; do
            node infra/tools/site-parity/audit-card-surface.js --baseline=site-20260928 --shard="$shard/8" --timeout-ms=120000
          done
      - name: Preserve game adapter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-adapter-reports-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}
            ${{ runner.temp }}/Accelerate/reports/site-adapter
          if-no-files-found: warn
          retention-days: 7
