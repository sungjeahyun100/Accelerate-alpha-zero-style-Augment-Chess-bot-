name: Native bot code validation

on:
  pull_request:
    branches: [develop, main, feature/full-stack-implementation]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      adapter_only:
        description: Run the pinned game adapter jobs without rebuilding the native engine
        type: boolean
        required: false
        default: false
      core_only:
        description: Rust core와 동결 JS adapter만 검사합니다. wheel·봇은 제외하며 adapter_only와 함께 선택할 수 없습니다.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Explicit bash also gives Windows multi-command checks fail-on-error behavior.
defaults:
  run:
    shell: bash

concurrency:
  group: native-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.adapter_only != true }}
    name: Rust ${{ inputs.core_only == true && 'core' || 'workspace' }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Configure external artifact slots
        env:
          ACCELERATE_CI_CORE_ONLY: ${{ inputs.core_only == true }}
          ACCELERATE_CI_ADAPTER_ONLY: ${{ inputs.adapter_only == true }}
        run: python .github/scripts/native-bot-check.py configure
      - name: Identify Rust validation inputs
        id: identity
        run: python .github/scripts/native-ci-reuse.py key "$ACCELERATE_RUST_SCOPE"
      - name: Restore successful Rust validation
        id: verified
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}/${{ steps.identity.outputs.scope }}-success.json
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}/${{ steps.identity.outputs.scope }}-scope.json
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}/${{ steps.identity.outputs.scope }}-test-list.txt
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}/${{ steps.identity.outputs.scope }}-test-output.txt
          key: ${{ steps.identity.outputs.key }}
      - name: Repository and adapter contract policy
        run: |
          node --test .github/scripts/check-repository-policy.test.mjs
          node .github/scripts/check-repository-policy.mjs
          node packages/adapter-contract/verify.mjs
          python -B .github/scripts/native-ci-reuse.test.py
          git diff --check
      - name: Verify reused Rust success
        if: ${{ steps.verified.outputs.cache-hit == 'true' }}
        run: python .github/scripts/native-ci-reuse.py verify "$ACCELERATE_RUST_SCOPE"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-12
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - name: Rust workspace formatting and strict lint
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        run: |
          if [ "$ACCELERATE_RUST_SCOPE" = core ]; then
            cargo fmt -p augment-chess-engine -p augment-chess-contracts -p adapter-runtime -p augment-chess-v6-migration --check
            cargo clippy -p augment-chess-engine -p augment-chess-contracts -p adapter-runtime -p augment-chess-v6-migration --all-targets --locked -- -D warnings
          else
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --locked -- -D warnings
          fi
      # scope=core excludes PyO3/ONNX crates; scope=rust keeps the workspace run.
      # Both execute core tests, rather than accepting only a test-name list.
      - name: Rust tests including geometry and MoveProgram
        id: rust_tests
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        run: python .github/scripts/native-bot-check.py rust-scope --scope "$ACCELERATE_RUST_SCOPE"
      - name: Record successful Rust validation
        if: ${{ success() && steps.verified.outputs.cache-hit != 'true' && steps.rust_tests.outcome == 'success' }}
        run: python .github/scripts/native-ci-reuse.py record "$ACCELERATE_RUST_SCOPE"
      - name: Preserve Rust validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-${{ steps.identity.outputs.scope }}-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}
          if-no-files-found: warn
          retention-days: 7

  native-bot:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.adapter_only != true && inputs.core_only != true) }}
    name: Installed native wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux wheel currently requires glibc 2.39 (manylinux_2_39).
          - os: ubuntu-24.04
            uv-checksum: 23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8
          - os: windows-2025
            uv-checksum: 6dbb02d79e419522f1c500f0adb1cddcff0cda7d59b0d66ea7f5e3b4a1b2f5f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Configure external artifact slots
        run: python .github/scripts/native-bot-check.py configure
      - name: Identify installed validation inputs
        id: identity
        run: python .github/scripts/native-ci-reuse.py key native
      - name: Restore successful installed validation
        id: verified
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}
            ${{ runner.temp }}/Accelerate/reports/v7-native-differential
          key: ${{ steps.identity.outputs.key }}
      - name: Verify reused installed success
        if: ${{ steps.verified.outputs.cache-hit == 'true' }}
        run: python .github/scripts/native-ci-reuse.py verify native
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        with:
          version: '0.12.19'
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
          download-from-astral-mirror: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-12
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        with:
          toolchain: '1.96.0'
      - name: Locked dependencies and sdist to installed wheel
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        run: python .github/scripts/native-bot-check.py build
      - name: Installed native, typed IR, both models, ort / tract, search and bounded CLI tests
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        run: python .github/scripts/native-bot-check.py tests
      - name: Installed wheel against pinned v7 source differential
        id: native_differential
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        run: python .github/scripts/native-bot-check.py v7-differential
      - name: Record successful installed validation
        if: ${{ success() && steps.verified.outputs.cache-hit != 'true' && steps.native_differential.outcome == 'success' }}
        run: python .github/scripts/native-ci-reuse.py record native
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bot-reports-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}
            ${{ runner.temp }}/Accelerate/reports/v7-native-differential
          if-no-files-found: warn
          retention-days: 7

  game-adapter:
    name: Frozen game adapter / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full v6/v7 parity runs on both OSes; synthetic card probes are split.
          - os: ubuntu-24.04
            audit_shards: '0 2 4 6'
          - os: windows-2025
            audit_shards: '1 3 5 7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate requested validation scope
        id: requested_scope
        env:
          ACCELERATE_CI_CORE_ONLY: ${{ inputs.core_only == true }}
          ACCELERATE_CI_ADAPTER_ONLY: ${{ inputs.adapter_only == true }}
        run: python .github/scripts/native-bot-check.py validate-scope
      - name: Identify frozen adapter validation inputs
        id: identity
        run: python .github/scripts/native-ci-reuse.py key adapter
      - name: Restore successful frozen adapter validation
        id: verified
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}/adapter-success.json
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}/frozen-source.json
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}/current-client-source.json
            ${{ runner.temp }}/Accelerate/reports/site-adapter
          key: ${{ steps.identity.outputs.key }}
      - name: Verify reused frozen adapter success
        if: ${{ steps.verified.outputs.cache-hit == 'true' }}
        env:
          ACCELERATE_ADAPTER_SHARDS: ${{ matrix.audit_shards }}
        run: python .github/scripts/native-ci-reuse.py verify adapter
      - name: Verify previous v6 frozen client and runtime contract
        if: ${{ steps.verified.outputs.cache-hit != 'true' }}
        run: python .github/scripts/native-bot-check.py frozen
      - name: Verify pinned current v7 client, metadata and three-mode parity
        id: current
        if: ${{ !cancelled() && steps.requested_scope.outcome == 'success' && steps.verified.outputs.cache-hit != 'true' }}
        run: python .github/scripts/native-bot-check.py current-client
      - name: Audit bounded current card surface
        id: adapter_audit
        if: ${{ !cancelled() && steps.current.outcome == 'success' && steps.verified.outputs.cache-hit != 'true' }}
        env:
          AUDIT_SHARDS: ${{ matrix.audit_shards }}
        run: |
          set -e
          for shard in $AUDIT_SHARDS; do
            node projects/augment-chess/oracle/tools/site-parity/audit-card-surface.js --baseline=site-20260928 --shard="$shard/8" --timeout-ms=120000
          done
      - name: Record successful frozen adapter validation
        if: ${{ success() && steps.verified.outputs.cache-hit != 'true' && steps.adapter_audit.outcome == 'success' }}
        env:
          ACCELERATE_ADAPTER_SHARDS: ${{ matrix.audit_shards }}
        run: python .github/scripts/native-ci-reuse.py record adapter
      - name: Preserve game adapter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-adapter-reports-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/Accelerate/reports/native-bot/${{ runner.os }}
            ${{ runner.temp }}/Accelerate/reports/site-adapter
          if-no-files-found: warn
          retention-days: 7
