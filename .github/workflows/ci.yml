name: CI (engine checks)

# Fast guard (about 2-3 min, no npm install needed) that runs on every push to
# master and on pull requests. It exists because several real bugs were only
# found late by hand: a stale-cache bug in the evaluation speed-up, the
# extension losing its search-progress hooks when its engine was swapped, and
# NNUE encoder/engine drift between training and the extension.
#
# Checks:
#   1. syntax of every engine / extension / pipeline script
#   2. extension manifest is valid JSON and lists both model files
#   3. smoke test (search survives special pieces and cards)
#   4. golden eval: evaluateStateComponents output unchanged (NNUE features)
#   5. extension NNUE score == training-pipeline NNUE score (both models)
#   6. site parity (needs network, warning only): move lists vs the live site
#
# An intentional evaluation change must update the golden file:
#   node tools/ci/golden-eval.js --update
on:
  push:
    branches: [main, develop]
    paths:
      - "projects/augment-chess/reference/infra/**"
      - "projects/augment-chess/oracle/tools/site-parity/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/augment-chess/reference/infra/**"
      - "projects/augment-chess/oracle/tools/site-parity/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/augment-chess/reference/infra

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          set -e
          for f in engine-merged.js selfplay-worker-merged.js selfplay-run-merged.js smoke-merged.js nnue/*.js tools/ci/*.js tools/perf/*.js ../../oracle/tools/site-parity/*.js; do
            node --check "$f"
          done
          echo "syntax ok"

      - name: Smoke test
        run: node smoke-merged.js

      - name: Golden evaluation check
        run: node tools/ci/golden-eval.js

      - name: Site parity (needs network; warning only)
        run: |
          report_dir="$RUNNER_TEMP/Accelerate/reports/live-site-parity"
          mkdir -p "$report_dir"
          set +e
          node ../../oracle/tools/site-parity/parity-actions.js - 200 > "$report_dir/parity-actions.txt" 2>&1
          rc=$?
          cat "$report_dir/parity-actions.txt"
          set -e
          if [ $rc -ne 0 ]; then
            echo "::warning::live-site parity-actions.js exited $rc; exact diagnostic is in the step log and live-site-parity report"
          fi
          {
            echo "Live-site parity exited $rc (informational network check)."
            echo '```text'
            cat "$report_dir/parity-actions.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve live-site parity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-parity
          path: ${{ runner.temp }}/Accelerate/reports/live-site-parity
          if-no-files-found: warn
          retention-days: 7
