name: site-watch
# Daily check whether the live site (augmentchess.org) shipped a new bundle / aiWorker; if so run parity tests.
# Read-only: never commits, pushes, opens issues, or touches last-seen.json in the repo.
# Team repo version: manual start (workflow_dispatch). The original ran daily at 03:17 UTC:
#   schedule: [{ cron: "17 3 * * *" }]
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_WATCH_REPORT_DIR: ${{ runner.temp }}/Accelerate/reports/site-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check live site
        id: check
        working-directory: projects/augment-chess/oracle/tools/site-parity
        run: |
          mkdir -p "$SITE_WATCH_REPORT_DIR"
          set +e
          node check-site-update.js > "$SITE_WATCH_REPORT_DIR/check.txt" 2>&1
          rc=$?
          cat "$SITE_WATCH_REPORT_DIR/check.txt"
          set -e
          if [ $rc -eq 2 ]; then
            echo "status=neterr" >> "$GITHUB_OUTPUT"
            echo "::warning::site-watch: check-site-update.js exited 2 (network/parse error); exact diagnostic is in check.txt and the step log"
          elif [ $rc -ne 0 ]; then
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "::error::site-watch: check-site-update.js exited $rc; exact diagnostic is in check.txt and the step log"
            exit "$rc"
          elif grep -q '^CHANGED' "$SITE_WATCH_REPORT_DIR/check.txt"; then
            echo "status=changed" >> "$GITHUB_OUTPUT"
          elif grep -q '^UNCHANGED' "$SITE_WATCH_REPORT_DIR/check.txt"; then
            echo "status=unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "::error::site-watch: check-site-update.js exited 0 without CHANGED or UNCHANGED output"
            exit 1
          fi
          exit 0
      - name: Quiet summary (nothing to do)
        if: steps.check.outputs.status != 'changed'
        run: |
          {
            echo "site-watch: ${{ steps.check.outputs.status }}"
            echo '```text'
            cat "$SITE_WATCH_REPORT_DIR/check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch real worker and run parity tests
        if: steps.check.outputs.status == 'changed'
        working-directory: projects/augment-chess/oracle/tools/site-parity
        run: |
          set +e
          R="$SITE_WATCH_REPORT_DIR/report.md"
          {
            echo "# Site update detected"
            echo
            echo '```text'
            cat "$SITE_WATCH_REPORT_DIR/check.txt"
            echo '```'
          } > "$R"
          node fetch-real-worker.js --force > "$SITE_WATCH_REPORT_DIR/fetch.txt" 2>&1
          frc=$?
          cat "$SITE_WATCH_REPORT_DIR/fetch.txt"
          {
            echo
            echo "## fetch-real-worker (exit $frc)"
            echo '```text'
            cat "$SITE_WATCH_REPORT_DIR/fetch.txt"
            echo '```'
          } >> "$R"
          if [ $frc -ne 0 ]; then
            echo "::warning::fetch-real-worker.js exited $frc; parity tests skipped; exact diagnostic is in fetch.txt and the step log"
          else
            for t in "parity-actions.js - 200" "parity-apply.js - 150" "parity-playout.js - 15"; do
              set -- $t
              log="$SITE_WATCH_REPORT_DIR/${1%.js}.txt"
              timeout 600 node "$1" "$2" "$3" > "$log" 2>&1
              rc=$?
              cat "$log"
              {
                echo
                echo "## $1 (exit $rc)"
                echo '```text'
                cat "$log"
                echo '```'
              } >> "$R"
              if [ $rc -ne 0 ]; then
                echo "::warning::$1 exited $rc; exact diagnostic is in ${1%.js}.txt and the step log"
              fi
            done
          fi
          echo
          {
            echo
            echo "Next (manual): review, then run \`node projects/augment-chess/oracle/tools/site-parity/check-site-update.js --save\` locally and commit last-seen.json."
          } >> "$R"
          cat "$R" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-watch-report
          path: ${{ runner.temp }}/Accelerate/reports/site-watch
          if-no-files-found: warn
          retention-days: 30
