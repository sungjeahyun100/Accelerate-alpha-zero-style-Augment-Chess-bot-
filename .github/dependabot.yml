version: 2
updates:
  # Historical JS oracle and training pipeline packages
  - package-ecosystem: "npm"
    directory: "/projects/augment-chess/reference/infra"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # GitHub Actions used by the workflows (checkout, setup-node, rust-toolchain, artifacts)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Root Rust workspace lock and member crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
