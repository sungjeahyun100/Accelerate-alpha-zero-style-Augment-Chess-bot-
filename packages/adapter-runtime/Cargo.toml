[package]
name = "adapter-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Project-independent typed adapter registry and invocation runtime"
readme = "README.md"
repository = "https://github.com/sungjeahyun100/Accelerate-alpha-zero-style-Augment-Chess-bot-"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1.1.0"

[dev-dependencies]
serde_json = "1"
